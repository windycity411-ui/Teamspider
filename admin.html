<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관리자 · 팀 스파이더</title>
<meta name="theme-color" content="#C0453A">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/style.css">
<style>
  .toolbar{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
  .toolbar input[type=date],.toolbar select{width:auto; min-width:120px}
  .att-in{width:78px; padding:5px 7px; font-size:13px; font-family:var(--mono)}
  .att-h{width:56px; padding:5px 7px; font-size:13px; font-family:var(--mono); text-align:right}
  .sec{margin-bottom:22px}
  .legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--ink-3)}
  .mini{font-size:12px; color:var(--ink-3); font-family:var(--mono)}
  .rate-row{display:grid; grid-template-columns:1fr 110px 34px; gap:7px; align-items:center; margin-bottom:6px}
  .set-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px}
</style>
</head>
<body>

<div class="tabs wrap" id="tabs" role="tablist"></div>

<main class="wrap" style="padding-block:18px 60px">
  <section id="v-dash"></section>
  <section id="v-att" hidden></section>
  <section id="v-calc" hidden></section>
  <section id="v-docs" hidden></section>
  <section id="v-notice" hidden></section>
  <section id="v-board" hidden></section>
  <section id="v-jobs" hidden></section>
  <section id="v-users" hidden></section>
  <section id="v-set" hidden></section>
</main>

<script type="module">
import { store, todayISO, nowISO, hhmm, dow, ymOf, uid } from './assets/store.js';
import { DOC_TYPES, BOARDS, ROLES, SETTINGS_DEFAULT, TRADES_DEFAULT, DEMO } from './assets/config.js';
import { $, $$, esc, toast, modal, confirmBox, topbar, guard, sendMail } from './assets/app.js';
import { calcDay, calcTeam, splitHours, won, gs, floorTo } from './assets/gongsu.js';

const me = await guard(3);
if(me){
  topbar(me);
  const isDev = me.role === 'dev';
  let S      = await store.meta('settings') || { ...SETTINGS_DEFAULT };
  let site   = await store.meta('site');
  let mail   = await store.meta('mail');
  let tmeta  = await store.meta('trades');
  let trades = Array.isArray(tmeta) ? tmeta : (tmeta?.list || [...TRADES_DEFAULT]);

  /* 직영팀장은 자기 파트만 */
  const scope = u => isDev || u.part === me.part;

  /* ── 탭 구성 ────────────────────────── */
  const TABS = [
    ['dash','대시보드'], ['att','출퇴근 관리'], ['calc','공수계산기'], ['docs','서류함'],
    ['notice','공지'], ['board','게시판'], ['jobs','구인'], ['users','근로자'],
    ...(isDev ? [['set','기준정보']] : [])
  ];
  $('#tabs').innerHTML = TABS.map(([k,l],i) =>
    `<button data-t="${k}" role="tab" aria-selected="${i===0}">${l}</button>`).join('');
  $$('#tabs button').forEach(b => b.onclick = () => go(b.dataset.t));

  const R = { dash:renderDash, att:renderAtt, calc:renderCalc, docs:renderDocs,
              notice:renderNotice, board:renderBoard, jobs:renderJobs,
              users:renderUsers, set:renderSet };

  function go(t){
    TABS.forEach(([k]) => $('#v-'+k).hidden = k !== t);
    $$('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === t));
    window.scrollTo(0,0);
    R[t]();
  }

  /* ── 공통 ───────────────────────────── */
  const allUsers = () => store.list('users');
  const workers  = async () => (await allUsers()).filter(u => u.role === 'worker' && scope(u));
  const uname = (list,id) => list.find(u => u.id === id)?.name || '(삭제됨)';
  const tag = (cls,txt) => `<span class="tag ${cls}">${txt}</span>`;
  const stTag = s => ({ ok:tag('t-ok','정상'), pending:tag('t-wait','승인대기'), reject:tag('t-no','반려') }[s] || tag('t-off','-'));

  async function monthStats(userId, upToDate){
    const ym = ymOf(upToDate);
    const rows = await store.list('attendance', a =>
      a.userId === userId && ymOf(a.date) === ym && a.date <= upToDate && a.status !== 'reject' && a.checkIn);
    return {
      days: rows.length,
      hours: rows.reduce((s,r) => s + (r.normalHours||0) + (r.overtimeHours||0), 0)
    };
  }

  /* ══════════════ 1. 대시보드 ══════════════ */
  async function renderDash(){
    const today = todayISO();
    const ws  = await workers();
    const att = (await store.list('attendance', a => a.date === today))
                  .filter(a => ws.some(w => w.id === a.userId));
    const docs = (await store.list('documents')).filter(d => ws.some(w => w.id === d.userId));
    const pend = att.filter(a => a.status === 'pending');
    const apps = await store.list('applications', a => a.status === 'wait');
    const unapproved = (await allUsers()).filter(u => u.role === 'worker' && !u.approved && scope(u));
    const mailFail = (await store.list('documents')).filter(d => d.mailStatus === 'fail');

    // 오늘 인건비
    let cost = 0, gsum = 0;
    for(const a of att){
      if(!a.checkIn) continue;
      const w = ws.find(x => x.id === a.userId); if(!w) continue;
      const m = await monthStats(w.id, today);
      const c = calcDay({ unitRate:w.unitRate, normalHours:a.normalHours, overtimeHours:a.overtimeHours,
                          nightHours:a.nightHours, holiday:a.holiday, monthDays:m.days, monthHours:m.hours, s:S });
      cost += c.gross; gsum += c.gongsu.total;
    }

    const missDocs = ws.filter(w => DOC_TYPES.filter(t=>t.required)
      .some(t => !docs.some(d => d.userId === w.id && d.type === t.key && d.status === 'ok'))).length;

    $('#v-dash').innerHTML = `
      <div class="spread sec">
        <div>
          <h2 style="font-size:19px">${esc(site.name)} · ${today.replace(/-/g,'. ')} (${dow(today)})</h2>
          <p class="mini">${isDev ? '전체 현장' : me.part + ' 범위'} · ${esc(ROLES[me.role].label)}</p>
        </div>
        <button class="btn btn-sm" id="goAtt">출퇴근 관리로 이동</button>
      </div>

      <div class="grid g4 sec">
        <div class="stat"><span class="k">금일 출퇴근</span><span class="v">${att.filter(a=>a.checkIn).length}</span><span class="u">/ ${ws.length}명</span></div>
        <div class="stat"><span class="k">금일 공수</span><span class="v">${gs(gsum)}</span><span class="u">공수</span></div>
        <div class="stat hot"><span class="k">금일 인건비</span><span class="v">${won(cost)}</span><span class="u">원</span></div>
        <div class="stat ${pend.length?'bad':''}"><span class="k">승인 대기</span><span class="v">${pend.length}</span><span class="u">건</span></div>
      </div>

      <div class="grid g2">
        <div class="panel">
          <div class="panel-h"><h3>처리 대기</h3></div>
          <ul class="list">
            ${row('출퇴근 승인 대기', pend.length, 'att')}
            ${row('가입 승인 대기', unapproved.length, 'users')}
            ${row('필수 서류 미비 인원', missDocs, 'docs')}
            ${row('채용 지원서 미검토', apps.length, 'jobs')}
            ${row('메일 발송 실패', mailFail.length, 'docs')}
          </ul>
        </div>
        <div class="panel">
          <div class="panel-h"><h3>금일 출퇴근 현황</h3></div>
          <div class="tablewrap" style="border:0;border-radius:0">
            <table>
              <thead><tr><th>이름</th><th>직종</th><th>출근</th><th>퇴근</th><th>상태</th></tr></thead>
              <tbody>${ws.map(w => {
                const a = att.find(x => x.userId === w.id);
                return `<tr class="${a && a.status==='pending' ? 'needs' : ''}"><td>${esc(w.name)}</td><td class="small">${esc(w.trade)}</td>
                  <td class="n">${a?.checkIn?hhmm(a.checkIn):'-'}</td>
                  <td class="n">${a?.checkOut?hhmm(a.checkOut):'-'}</td>
                  <td>${a ? stTag(a.status) : tag('t-off','미출근')}</td></tr>`;
              }).join('')}</tbody>
            </table>
          </div>
        </div>
      </div>`;

    function row(label, n, to){
      return `<li class="spread" style="cursor:pointer" data-go="${to}">
        <span>${label}</span>
        <span class="tag ${n?'t-wait':'t-ok'}">${n}건</span></li>`;
    }
    $$('[data-go]').forEach(x => x.onclick = () => go(x.dataset.go));
    $('#goAtt').onclick = () => go('att');
  }

  /* ══════════════ 2. 출퇴근 관리 ══════════════ */
  let attDate = todayISO();
  async function renderAtt(){
    const ws = await workers();
    const att = await store.list('attendance', a => a.date === attDate);

    $('#v-att').innerHTML = `
      <div class="toolbar">
        <label class="f" style="margin:0">일자</label>
        <input type="date" id="ad" value="${attDate}">
        <button class="btn btn-sm" id="adPrev">◀ 전일</button>
        <button class="btn btn-sm" id="adNext">익일 ▶</button>
        <span style="flex:1"></span>
        <button class="btn btn-sm" id="bulkIn">전원 정상출근 입력</button>
        <button class="btn btn-sm btn-p" id="saveAtt">저장</button>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr>
            <th>이름</th><th>직종</th><th>출근</th><th>퇴근</th>
            <th class="n">정상</th><th class="n">연장</th><th class="n">야간</th>
            <th>휴일</th><th class="n">공수</th><th class="n">지급총액</th><th>상태</th><th></th>
          </tr></thead>
          <tbody id="attBody"></tbody>
        </table>
      </div>
      <p class="mini" style="margin-top:9px">수정 시 수정자·시각·사유가 기록에 남습니다. 승인 대기 건은 사유 확인 후 승인/반려하십시오.</p>`;

    $('#ad').onchange = e => { attDate = e.target.value; renderAtt(); };
    $('#adPrev').onclick = () => { attDate = shift(attDate,-1); renderAtt(); };
    $('#adNext').onclick = () => { attDate = shift(attDate, 1); renderAtt(); };

    const body = $('#attBody');
    body.innerHTML = ws.map(w => {
      const a = att.find(x => x.userId === w.id) || {};
      return `<tr data-u="${w.id}" data-a="${a.id||''}" class="${a.status==='pending' ? 'needs' : ''}">
        <td class="nowrap">${esc(w.name)}</td>
        <td class="small nowrap">${esc(w.trade)}</td>
        <td><input class="att-in" type="time" data-f="in"  value="${a.checkIn?hhmm(a.checkIn):''}"></td>
        <td><input class="att-in" type="time" data-f="out" value="${a.checkOut?hhmm(a.checkOut):''}"></td>
        <td><input class="att-h" type="number" step="0.5" data-f="nh" value="${a.normalHours??''}"></td>
        <td><input class="att-h" type="number" step="0.5" data-f="oh" value="${a.overtimeHours??''}"></td>
        <td><input class="att-h" type="number" step="0.5" data-f="gh" value="${a.nightHours??''}"></td>
        <td style="text-align:center"><input type="checkbox" data-f="hol" ${a.holiday?'checked':''}></td>
        <td class="n" data-f="gs">-</td>
        <td class="n" data-f="pay">-</td>
        <td>${a.id?stTag(a.status):tag('t-off','미등록')}</td>
        <td class="nowrap">${a.status==='pending'
          ? `<button class="btn btn-sm" data-ok="${a.id}">승인</button>
             <button class="btn btn-sm" data-no="${a.id}">반려</button>`
          : (a.memo?`<button class="btn btn-sm" data-memo="${esc(a.memo)}">비고</button>`:'')}</td>
      </tr>`;
    }).join('');

    // 시간 입력 → 자동 분해 + 실시간 계산
    body.addEventListener('input', e => {
      const tr = e.target.closest('tr'); if(!tr) return;
      const f = e.target.dataset.f;
      if(f === 'in' || f === 'out'){
        const i = tr.querySelector('[data-f=in]').value, o = tr.querySelector('[data-f=out]').value;
        if(i && o){
          const h = splitHours(i, o, 60, S);
          tr.querySelector('[data-f=nh]').value = h.normal;
          tr.querySelector('[data-f=oh]').value = h.overtime;
          tr.querySelector('[data-f=gh]').value = h.night;
        }
      }
      recalcRow(tr, ws);
    });
    body.addEventListener('change', e => recalcRow(e.target.closest('tr'), ws));
    $$('#attBody tr').forEach(tr => recalcRow(tr, ws));

    $$('[data-ok]').forEach(b => b.onclick = async () => {
      await store.update('attendance', b.dataset.ok, { status:'ok' });
      await store.log('attendance', b.dataset.ok, 'approve', '반경 밖 기록 승인', me);
      toast('승인되었습니다.'); renderAtt();
    });
    $$('[data-no]').forEach(b => b.onclick = async () => {
      const r = await modal({ title:'반려', body:'<div class="field"><label class="f">반려 사유</label><input type="text" id="rj"></div>',
        actions:[{label:'취소',value:false},{label:'반려',value:true,cls:'btn-d',before(box){
          window.__rj = box.querySelector('#rj').value.trim();
          if(!window.__rj){ toast('사유를 입력하십시오.'); return false; } return true; }}]});
      if(!r) return;
      await store.update('attendance', b.dataset.no, { status:'reject', memo:window.__rj });
      await store.log('attendance', b.dataset.no, 'reject', window.__rj, me);
      toast('반려되었습니다.'); renderAtt();
    });
    $$('[data-memo]').forEach(b => b.onclick = () =>
      modal({ title:'비고', body:`<p>${esc(b.dataset.memo)}</p>`, actions:[{label:'닫기',value:1,cls:'btn-p'}] }));

    $('#bulkIn').onclick = () => {
      $$('#attBody tr').forEach(tr => {
        if(!tr.querySelector('[data-f=in]').value){
          tr.querySelector('[data-f=in]').value  = site.workStart || '07:00';
          tr.querySelector('[data-f=out]').value = site.workEnd   || '17:00';
          const h = splitHours(site.workStart||'07:00', site.workEnd||'17:00', 60, S);
          tr.querySelector('[data-f=nh]').value = h.normal;
          tr.querySelector('[data-f=oh]').value = h.overtime;
          tr.querySelector('[data-f=gh]').value = h.night;
          recalcRow(tr, ws);
        }
      });
      toast('입력되었습니다. 저장 버튼을 누르십시오.');
    };

    $('#saveAtt').onclick = async () => {
      let n = 0;
      for(const tr of $$('#attBody tr')){
        const uidv = tr.dataset.u, aid = tr.dataset.a;
        const i = tr.querySelector('[data-f=in]').value;
        const o = tr.querySelector('[data-f=out]').value;
        if(!i && !aid) continue;
        const patch = {
          checkIn:  i ? `${attDate}T${i}:00` : null,
          checkOut: o ? `${attDate}T${o}:00` : null,
          normalHours:   num(tr,'nh'), overtimeHours: num(tr,'oh'), nightHours: num(tr,'gh'),
          holiday: tr.querySelector('[data-f=hol]').checked
        };
        if(aid){
          await store.update('attendance', aid, patch);
          await store.log('attendance', aid, 'edit', `${attDate} 수기 수정`, me);
        }else{
          const w = (await allUsers()).find(u => u.id === uidv);
          const rec = await store.add('attendance', {
            ...patch, date:attDate, userId:uidv, part:w.part,
            method:'manual', status:'ok', memo:'관리자 수기 입력', confirmed:false
          });
          await store.log('attendance', rec.id, 'create', `${attDate} 수기 입력`, me);
        }
        n++;
      }
      toast(`${n}건 저장되었습니다.`);
      renderAtt();
    };

    function num(tr,f){ const v = parseFloat(tr.querySelector(`[data-f=${f}]`).value); return isNaN(v)?0:v; }

    async function recalcRow(tr, ws){
      if(!tr) return;
      const w = ws.find(x => x.id === tr.dataset.u); if(!w) return;
      const m = await monthStats(w.id, attDate);
      const c = calcDay({ unitRate:w.unitRate, normalHours:num(tr,'nh'), overtimeHours:num(tr,'oh'),
                          nightHours:num(tr,'gh'), holiday:tr.querySelector('[data-f=hol]').checked,
                          monthDays:Math.max(1,m.days), monthHours:m.hours, s:S });
      tr.querySelector('[data-f=gs]').textContent  = c.gongsu.total ? gs(c.gongsu.total) : '-';
      tr.querySelector('[data-f=pay]').textContent = c.gross ? won(c.gross) : '-';
    }
  }
  const shift = (iso,n) => { const d = new Date(iso); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };

  /* ══════════════ 3. 공수계산기 ══════════════ */
  async function renderCalc(){
    const ws = await workers();
    $('#v-calc').innerHTML = `
      <div class="grid" style="grid-template-columns:minmax(280px,380px) 1fr; gap:18px; align-items:start">
        <div class="panel">
          <div class="panel-h"><h3>조건 입력</h3><span class="mini">모의계산</span></div>
          <div class="panel-b">
            <div class="field">
              <label class="f" for="cw">근로자 (선택 시 단가 자동)</label>
              <select id="cw"><option value="">직접 입력</option>
                ${ws.map(w => `<option value="${w.id}">${esc(w.name)} · ${esc(w.trade)}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label class="f" for="ct">직종</label>
              <select id="ct">${trades.map(t => `<option value="${t.rate}">${esc(t.name)}</option>`).join('')}</select>
            </div>
            <div class="field">
              <label class="f" for="cr">단가 (원 / 1공수)</label>
              <input type="number" id="cr" value="${trades[0]?.rate||0}" step="1000">
            </div>
            <div class="grid g2">
              <div class="field"><label class="f" for="cin">출근</label><input type="time" id="cin" value="07:00"></div>
              <div class="field"><label class="f" for="cout">퇴근</label><input type="time" id="cout" value="17:00"></div>
            </div>
            <div class="grid g3">
              <div class="field"><label class="f" for="cnh">정상(h)</label><input type="number" id="cnh" value="8" step="0.5"></div>
              <div class="field"><label class="f" for="coh">연장(h)</label><input type="number" id="coh" value="0" step="0.5"></div>
              <div class="field"><label class="f" for="cgh">야간(h)</label><input type="number" id="cgh" value="0" step="0.5"></div>
            </div>
            <div class="grid g2">
              <div class="field"><label class="f" for="cmd">당월 출퇴근일수</label><input type="number" id="cmd" value="3" min="0"></div>
              <div class="field" style="display:flex;align-items:flex-end;gap:14px;padding-bottom:9px">
                <label><input type="checkbox" id="chol"> <span class="small">휴일</span></label>
                <label><input type="checkbox" id="calw" checked> <span class="small">수당</span></label>
              </div>
            </div>
            <button class="btn btn-p btn-block" id="cgo">계산</button>
          </div>
        </div>

        <div class="stack">
          <div id="calcOut"></div>
          <div class="panel">
            <div class="panel-h">
              <h3>금일 팀 일괄 계산</h3>
              <input type="date" id="td" value="${todayISO()}" style="width:auto">
            </div>
            <div class="tablewrap" style="border:0;border-radius:0"><table id="teamT"></table></div>
          </div>
        </div>
      </div>`;

    const g = id => $('#'+id);
    g('ct').onchange = () => g('cr').value = g('ct').value;
    g('cw').onchange = () => {
      const w = ws.find(x => x.id === g('cw').value);
      if(w){ g('cr').value = w.unitRate; const o = [...g('ct').options].find(o => o.textContent.includes(w.trade)); if(o) g('ct').value = o.value; }
    };
    const syncHours = () => {
      const h = splitHours(g('cin').value, g('cout').value, 60, S);
      g('cnh').value = h.normal; g('coh').value = h.overtime; g('cgh').value = h.night;
      run();
    };
    g('cin').onchange = syncHours; g('cout').onchange = syncHours;
    ['cr','cnh','coh','cgh','cmd','chol','calw'].forEach(id => g(id).onchange = run);
    g('cgo').onclick = run;

    function run(){
      const c = calcDay({
        unitRate:+g('cr').value, normalHours:+g('cnh').value, overtimeHours:+g('coh').value,
        nightHours:+g('cgh').value, holiday:g('chol').checked, allowance:g('calw').checked,
        monthDays:+g('cmd').value, monthHours:(+g('cmd').value)*8, s:S
      });
      const r = (k,v,b) => `<tr><td>${k}</td><td class="n">${b?`<b>${v}</b>`:v}</td></tr>`;
      $('#calcOut').innerHTML = `
        <div class="calcout">
          <table>
            <tbody>
              ${r('직종 단가', won(c.unitRate)+'원')}
              ${r('정상 '+gs(c.gongsu.normal)+'공수', won(floorTo(c.unitRate*c.gongsu.normal)))}
              ${c.gongsu.overtime ? r('연장 '+gs(c.gongsu.overtime)+'공수', won(floorTo(c.unitRate*c.gongsu.overtime))) : ''}

              ${c.meal  ? r('식대(비과세)', won(c.meal)) : ''}

              <tr class="total"><td>지급총액</td><td class="n">${won(c.gross)}</td></tr>
              ${r('고용보험', '−'+won(c.deductions.employment))}
              ${c.insuranceApplies
                ? r('국민연금', '−'+won(c.deductions.pension)) +
                  r('건강보험(장기요양 포함)', '−'+won(c.deductions.health + c.deductions.ltCare))
                : r('국민연금·건강보험', tag('t-off','미적용'))}
              ${r('소득세', '−'+won(c.deductions.incomeTax))}
              ${r('지방소득세', '−'+won(c.deductions.localTax))}
              <tr class="total"><td>공제계</td><td class="n">−${won(c.deductions.total)}</td></tr>
            </tbody>
          </table>
          <div class="final"><span>실지급액</span><b>${won(c.net)}원</b></div>

        <p class="mini" style="margin-top:8px">사업주 부담 산재보험 ${won(c.accident)}원 별도. 소득세는 소액부징수 기준 미만 시 0원 처리됨.</p>`;
    }
    run();

    /* 팀 일괄 */
    $('#td').onchange = teamCalc;
    async function teamCalc(){
      const d = $('#td').value;
      const att = await store.list('attendance', a => a.date === d);
      const rows = [];
      for(const w of ws){
        const a = att.find(x => x.userId === w.id);
        if(!a || !a.checkIn || a.status === 'reject') continue;
        const m = await monthStats(w.id, d);
        rows.push({ name:w.name, trade:w.trade, unitRate:w.unitRate,
          normalHours:a.normalHours, overtimeHours:a.overtimeHours, nightHours:a.nightHours,
          holiday:a.holiday, monthDays:m.days, monthHours:m.hours });
      }
      const { results, sum } = calcTeam(rows, S);
      $('#teamT').innerHTML = `
        <thead><tr><th>이름</th><th>직종</th><th class="n">공수</th><th class="n">지급총액</th><th class="n">공제</th><th class="n">실지급</th></tr></thead>
        <tbody>${results.map(r => `<tr>
          <td class="nowrap">${esc(r.name)}</td><td class="small nowrap">${esc(r.trade)}</td>
          <td class="n">${gs(r.calc.gongsu.total)}</td>
          <td class="n">${won(r.calc.gross)}</td>
          <td class="n">−${won(r.calc.deductions.total)}</td>
          <td class="n">${won(r.calc.net)}</td></tr>`).join('')
          || '<tr><td colspan="6" class="muted small">해당 일자 출퇴근 기록이 없습니다.</td></tr>'}</tbody>
        ${results.length ? `<tfoot><tr class="total"><td colspan="2">합계 ${results.length}명</td>
          <td class="n">${gs(sum.gongsu)}</td><td class="n">${won(sum.gross)}</td>
          <td class="n">−${won(sum.deduction)}</td><td class="n">${won(sum.net)}</td></tr></tfoot>` : ''}`;
    }
    teamCalc();
  }

  async function renderDocs(){

        </div>
        <div class="row" style="gap:9px">

      </div>

            return `<tr class="${miss>=2?'needs':''}">
            <td class="nowrap">${esc(w.name)}</td><td class="small nowrap">${esc(w.trade)}</td>
            ${DOC_TYPES.map(t => {
              const d = docs.filter(x => x.userId===w.id && x.type===t.key)

              const l = d.status==='ok'?'승인':d.status==='reject'?'반려':'검토';
              return `<td><button class="btn btn-sm" data-doc="${d.id}" style="padding:1px 6px;border:0;background:none">${tag(c,l)}</button></td>`;

        </table>
      </div>

      <div class="panel">
        <div class="panel-h"><h3>메일 발송 이력</h3>
          <span class="mini"${docs.filter(d=>d.mailStatus==='fail').length?' style="color:var(--accent)"':''}>${docs.filter(d=>d.mailStatus==='fail').length ? '실패 ' + docs.filter(d=>d.mailStatus==='fail').length + '건 — 재발송 필요' : '전건 발송 완료'}</span></div>
        <div class="tablewrap" style="border:0;border-radius:0">
          <table>
            <thead><tr><th>제출자</th><th>서류</th><th>제출일시</th><th>발송</th><th></th></tr></thead>
            <tbody>${docs.slice().sort((a,b)=>String(b.submittedAt).localeCompare(String(a.submittedAt))).slice(0,20).map(d=>{
              const st = d.mailStatus==='sent'?tag('t-ok','발송'):d.mailStatus==='fail'?tag('t-no','실패'):tag('t-wait','대기');
              return `<tr class="${d.mailStatus==='fail'?'needs':''}"><td>${esc(uname(ws,d.userId))}</td>
                <td class="small">${esc(DOC_TYPES.find(t=>t.key===d.type)?.label||d.type)}</td>

                <td>${d.mailStatus!=='sent'?`<button class="btn btn-sm" data-resend="${d.id}">재발송</button>`:''}</td></tr>`;

    $$('[data-doc]').forEach(b => b.onclick = async () => {
      const d = docs.find(x => x.id === b.dataset.doc);

      const r = await modal({
        title:`${uname(ws,d.userId)} · ${t.label}`,
        body:`<p class="small mono muted">${esc(d.fileName)} · ${String(d.submittedAt).slice(0,16).replace('T',' ')}</p>

                : '<div class="banner b-info small">미리보기를 지원하지 않는 형식입니다.</div>'}
              ${d.rejectReason?`<p class="small" style="color:var(--danger)">반려 사유: ${esc(d.rejectReason)}</p>`:''}`,
        actions:[
          { label:'닫기', value:null },
          { label:'반려', value:'reject', cls:'btn-d' },
          { label:'승인', value:'ok', cls:'btn-p' }
        ]
      });
      if(r === 'ok'){ await store.update('documents', d.id, { status:'ok', rejectReason:'' }); toast('승인되었습니다.'); renderDocs(); }
      if(r === 'reject'){
        const rr = await modal({ title:'반려 사유', body:'<div class="field"><input type="text" id="rr" placeholder="예: 이수증 유효기간 경과"></div>',
          actions:[{label:'취소',value:false},{label:'반려',value:true,cls:'btn-d',before(box){
            window.__rr = box.querySelector('#rr').value.trim();
            if(!window.__rr){ toast('사유를 입력하십시오.'); return false; } return true; }}]});
        if(rr){ await store.update('documents', d.id, { status:'reject', rejectReason:window.__rr }); toast('반려되었습니다.'); renderDocs(); }
      }
    });

    $$('[data-resend]').forEach(b => b.onclick = async () => {
      const d = docs.find(x => x.id === b.dataset.resend);
      const w = ws.find(x => x.id === d.userId);
      const res = await sendMail({
        subject:`[서류제출·재발송] ${w.name} — ${DOC_TYPES.find(t=>t.key===d.type)?.label}`,
        lines:[`성명 : ${w.name}`, `직종 : ${w.trade}`, `연락처 : ${w.phone}`,
               `재발송 : ${new Date().toLocaleString('ko-KR')}`],

      toast(res.ok ? '재발송되었습니다.' : `발송 실패: ${res.reason||'수신처 미지정'}`);
      renderDocs();
    });
  }

  let noticeSel = null;
  async function renderNotice(){
    const list = (await store.list('notices')).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
    const reads = await store.list('noticeReads');
    const ws = await workers();

    if(!noticeSel || !list.some(n => n.id === noticeSel)) noticeSel = list[0]?.id || null;
    const sel = list.find(n => n.id === noticeSel);
    const rs  = sel ? reads.filter(r => r.noticeId === sel.id) : [];
    const readers = rs.map(r => uname(ws, r.userId)).filter(n => n !== '(삭제됨)');
    const unread  = sel ? ws.filter(w => !rs.some(r => r.userId === w.id)).map(w => w.name) : [];

    $('#v-notice').innerHTML = `
      <div class="split2">
        <div class="stack">

          </div>
          <div class="panel"><ul class="list">${list.map(n => {
            const rc = reads.filter(r => r.noticeId === n.id).length;
            return `<li class="spread" data-ns="${n.id}" style="cursor:pointer;${n.id===noticeSel?'background:var(--surface-2)':''}">

        <div class="panel" style="border-top:3px solid var(--accent)">
          ${sel ? `
            <div class="panel-h" style="display:block">

              <div class="hd" style="color:var(--accent)">미확인 ${unread.length}명</div>

              ${sel.mustConfirm && unread.length
                ? '<div class="banner b-alert" style="margin-top:12px">확인 필수 공지는 미확인자가 로그인할 때마다 팝업이 다시 뜹니다. 출퇴근 전 확인 여부를 직접 챙겨야 하는 항목입니다.</div>'
                : ''}
            </div>`
          : '<div class="panel-b muted small">공지를 선택하면 확인자 명단이 표시됩니다.</div>'}
        </div>
      </div>`;

    $$('[data-ns]').forEach(li => li.onclick = e => {
      if(e.target.closest('button')) return;

      const ok = await modal({
        title:'공지 등록',

                <div class="field"><label class="f">시작일</label><input type="date" id="nf" value="${todayISO()}"></div>
                <div class="field"><label class="f">종료일</label><input type="date" id="ne" value="${shift(todayISO(),14)}"></div>
              </div>
              <div class="field"><label class="f">대상</label>
                <select id="ng"><option value="all">전체</option><option value="1팀">1팀</option><option value="2팀">2팀</option></select></div>

              <p class="small" style="color:var(--warn)"><b>미확인 ${unread.length}명</b> — ${esc(unread.join(', ')||'없음')}</p>`,
        actions:[{label:'닫기',value:1,cls:'btn-p'}] });
    });
    $$('[data-nd]').forEach(b => b.onclick = async () => {
      if(!await confirmBox('공지 삭제','삭제하면 복구할 수 없습니다. 삭제하시겠습니까?','삭제')) return;

          <thead><tr><th>제목</th><th>직종</th><th class="n">인원</th><th class="n">단가</th><th>지원</th><th>공개</th><th>상태</th><th></th></tr></thead>
          <tbody>${jobs.map(j => `<tr>
            <td>${esc(j.title)}</td><td class="small">${esc(j.trade)}</td>
            <td class="n">${j.count}</td><td class="n">${won(j.rate)}</td>
            <td>${apps.filter(a=>a.jobId===j.id).length}명</td>
            <td>${j.public?tag('t-ok','외부공개'):tag('t-off','회원전용')}</td>
            <td>${j.open?tag('t-ok','모집중'):tag('t-off','마감')}</td>
            <td class="nowrap"><button class="btn btn-sm" data-jt="${j.id}">${j.open?'마감':'재개'}</button>
              <button class="btn btn-sm" data-jd="${j.id}">삭제</button></td></tr>`).join('')
            || '<tr><td colspan="8" class="muted small">등록된 공고가 없습니다.</td></tr>'}</tbody>
        </table></div>
      </div>

      <div class="panel">
        <div class="panel-h"><h3>지원자</h3>
          <span class="mini">채용 확정 시 근로자 계정이 자동 생성되고 제출 서류가 승계됩니다</span></div>
        <div class="tablewrap" style="border:0;border-radius:0"><table>
          <thead><tr><th>지원공고</th><th>성명</th><th>연락처</th><th>직종</th><th>경력</th><th>서류</th><th>메일</th><th>상태</th><th></th></tr></thead>
          <tbody>${apps.map(a => {
            const j = jobs.find(x => x.id === a.jobId);
            return `<tr class="${a.status==='wait'?'needs':''}"><td class="small">${esc(j?.title||'-')}</td>
              <td>${esc(a.name)}</td><td class="mini">${esc(a.phone)}</td>
              <td class="small">${esc(a.trade)}</td><td class="small">${esc(a.career||'-')}</td>
              <td class="mini">${(a.docs||[]).length}건</td>
              <td>${a.mailStatus==='sent'?tag('t-ok','발송'):a.mailStatus==='fail'?tag('t-no','실패'):tag('t-wait','대기')}</td>
              <td>${a.status==='hired'?tag('t-ok','채용'):a.status==='drop'?tag('t-no','불채용'):tag('t-wait','검토중')}</td>
              <td class="nowrap">${a.status==='wait'
                ? `<button class="btn btn-sm btn-p" data-hire="${a.id}">채용</button>
                   <button class="btn btn-sm" data-drop="${a.id}">불채용</button>` : ''}</td></tr>`;
          }).join('') || '<tr><td colspan="9" class="muted small">지원자가 없습니다.</td></tr>'}</tbody>
        </table></div>
      </div>`;

    $('#jNew').onclick = async () => {
      const ok = await modal({ title:'공고 등록',
        body:`<div class="field"><label class="f">제목</label><input type="text" id="jt" placeholder="예: 형틀목공 모집 (봉담 제1현장)"></div>
              <div class="grid g2">
                <div class="field"><label class="f">직종</label><select id="jr">${trades.map(t=>`<option value="${esc(t.name)}" data-r="${t.rate}">${esc(t.name)}</option>`).join('')}</select></div>
                <div class="field"><label class="f">단가</label><input type="number" id="jp" value="${trades[0]?.rate||0}" step="1000"></div>
              </div>
              <div class="grid g2">
                <div class="field"><label class="f">모집 인원</label><input type="number" id="jc" value="1" min="1"></div>
                <div class="field"><label class="f">기간</label><input type="text" id="jd" value="상시"></div>
              </div>
              <div class="field"><label class="f">근무지</label><input type="text" id="jl" value="${esc(site.address||'')}"></div>
              <div class="field"><label class="f">상세 내용</label><textarea id="jb"></textarea></div>
              <div class="field"><label class="f">문의 연락처</label><input type="tel" id="jn" value="${esc(me.phone||'')}"></div>
              <div class="field"><label><input type="checkbox" id="jo" checked> <span class="small">로그인 없이 외부 공개</span></label></div>`,
        actions:[{label:'취소',value:false},{label:'등록',value:true,cls:'btn-p',before(box){
          const t = box.querySelector('#jt').value.trim();
          if(!t){ toast('제목을 입력하십시오.'); return false; }
          window.__j = { title:t, trade:box.querySelector('#jr').value, rate:+box.querySelector('#jp').value,
            count:+box.querySelector('#jc').value, period:box.querySelector('#jd').value,
            location:box.querySelector('#jl').value, desc:box.querySelector('#jb').value,
            contact:box.querySelector('#jn').value, public:box.querySelector('#jo').checked, open:true };
          return true; }}]});
      if(!ok) return;
      await store.add('jobs', window.__j); toast('등록되었습니다.'); renderJobs();
    };

    $$('[data-jt]').forEach(b => b.onclick = async () => {
      const j = jobs.find(x => x.id === b.dataset.jt);
      await store.update('jobs', j.id, { open: !j.open }); renderJobs();
    });
    $$('[data-jd]').forEach(b => b.onclick = async () => {
      if(!await confirmBox('공고 삭제','삭제하시겠습니까?','삭제')) return;
      await store.remove('jobs', b.dataset.jd); renderJobs();
    });
    $$('[data-drop]').forEach(b => b.onclick = async () => {
      await store.update('applications', b.dataset.drop, { status:'drop' }); renderJobs();
    });
    $$('[data-hire]').forEach(b => b.onclick = async () => {
      const a = apps.find(x => x.id === b.dataset.hire);
      if(!await confirmBox('채용 확정', `${a.name} 지원자를 채용 확정하고 근로자 계정을 생성합니다.`, '채용')) return;
      const rate = trades.find(t => t.name === a.trade)?.rate || 0;
      await store.add('users', {
        name:a.name, phone:a.phone, role:'worker', trade:a.trade, unitRate:rate,
        part: isDev ? '1팀' : me.part, approved:true, geoConsent:false
      });
      // 지원 시 제출한 서류 승계
      for(const d of (a.docs||[])){
        await store.add('documents', { userId:'', type:d.type, status:'wait',
          fileName:d.fileName, fileUrl:d.url||'', submittedAt:nowISO(), mailStatus:'sent', note:'채용 시 승계' });
      }
      await store.update('applications', a.id, { status:'hired' });
      toast('채용 확정 — 근로자 계정이 생성되었습니다.');
      renderJobs();
    });
  }

  /* ══════════════ 8. 근로자 ══════════════ */
  async function renderUsers(){
    const us = (await allUsers()).filter(u => scope(u)).sort((a,b) => (a.approved?1:0)-(b.approved?1:0));
    const pending = us.filter(u => !u.approved);

    $('#v-users').innerHTML = `
      <div class="spread sec">
        <div>
          <h2 style="font-size:21px">근로자 관리</h2>
          <p class="mini" style="margin:4px 0 0">${isDev?'전체':me.part} · ${us.length}명${pending.length?` · 승인 대기 ${pending.length}명`:''}</p>
        </div>
        <div class="row" style="gap:8px">
          <button class="btn btn-sm" id="uReload">새로고침</button>
          <button class="btn btn-sm btn-p" id="uNew">근로자 추가</button>
        </div>
      </div>

      ${pending.length ? `
      <div class="panel sec" style="border-top:3px solid var(--accent)">
        <div class="panel-h">
          <h3>가입 승인 대기 ${pending.length}명</h3>
          <span class="mini">승인해야 출퇴근·서류제출이 열립니다</span>
        </div>
        <ul class="list">
          ${pending.map(u => `
            <li class="spread" style="gap:10px">
              <div style="min-width:0">
                <div class="li-t">${esc(u.name)} ${tag('t-off', esc(u.trade || '직종 미지정'))}</div>
                <div class="li-m">${esc(u.loginId || '-')} · ${esc(u.phone || '-')} · ${esc(u.part || '-')}</div>
              </div>
              <div class="row" style="gap:6px">
                <button class="btn btn-sm btn-p" data-ua="${u.id}">승인</button>
                <button class="btn btn-sm" data-ue="${u.id}">정보 수정</button>
              </div>
            </li>`).join('')}
        </ul>
      </div>` : ''}
      <p class="mini" style="margin:0 0 6px">전체 명단 — 좁은 화면에서는 표를 옆으로 밀어서 보십시오.</p>
      <div class="tablewrap"><table>
        <thead><tr><th>이름</th><th>아이디</th><th>연락처</th><th>역할</th><th>직종</th><th class="n">단가</th><th>소속</th><th>상태</th><th></th></tr></thead>
        <tbody>${us.map(u => `<tr class="${u.approved?'':'needs'}">
          <td class="nowrap">${esc(u.name)}</td>
          <td class="mini">${esc(u.loginId || '-')}</td>
          <td class="mini">${esc(u.phone)}</td>
          <td>${tag(u.role==='dev'?'t-no':u.role==='lead'?'t-wait':'t-off', ROLES[u.role].label)}</td>
          <td class="small">${esc(u.trade||'-')}</td>
          <td class="n">${u.unitRate?won(u.unitRate):'-'}</td>
          <td class="small">${esc(u.part||'-')}</td>
          <td>${u.approved?tag('t-ok','정상'):tag('t-wait','승인대기')}</td>
          <td class="nowrap">
            ${!u.approved?`<button class="btn btn-sm btn-p" data-ua="${u.id}">승인</button>`:''}
            <button class="btn btn-sm" data-ue="${u.id}">수정</button>
            ${isDev && u.id!==me.id?`<button class="btn btn-sm" data-ur="${u.id}">삭제</button>`:''}
          </td></tr>`).join('')}</tbody>
      </table></div>
      <div class="banner b-info" style="margin-top:12px">승인 전 계정은 출퇴근·서류제출 기능이 잠겨 있습니다. 역할·단가·승인 상태 변경은 전부 이력에 남습니다.</div>`;

    const rl = $('#uReload');
    if(rl) rl.onclick = () => renderUsers();

    $$('[data-ua]').forEach(b => b.onclick = async () => {
      b.disabled = true;
      await store.update('users', b.dataset.ua, { approved:true });
      await store.log('users', b.dataset.ua, 'approve', '가입 승인', me);
      toast('승인되었습니다.'); renderUsers();
    });
    $$('[data-ur]').forEach(b => b.onclick = async () => {
      if(!await confirmBox('계정 삭제','출퇴근 기록은 남습니다. 계정을 삭제하시겠습니까?','삭제')) return;
      await store.remove('users', b.dataset.ur); renderUsers();
    });
    $$('[data-ue]').forEach(b => b.onclick = () => editUser(us.find(u => u.id === b.dataset.ue)));
    $('#uNew').onclick = () => editUser(null);

    async function editUser(u){
      const roleOpts = (isDev ? ['dev','lead','worker'] : ['worker'])
        .map(r => `<option value="${r}" ${u?.role===r?'selected':''}>${ROLES[r].label}</option>`).join('');
      const ok = await modal({
        title: u ? `${u.name} 정보 수정` : '근로자 추가',
        body:`${u?.loginId ? `<div class="field"><label class="f">아이디</label>
                <input type="text" value="${esc(u.loginId)}" disabled>
                <div class="hint">아이디는 변경할 수 없습니다. 비밀번호 분실 시 계정을 새로 만들어야 합니다.</div></div>` : ''}
              <div class="grid g2">
                <div class="field"><label class="f">이름</label><input type="text" id="un" value="${esc(u?.name||'')}"></div>
                <div class="field"><label class="f">연락처</label><input type="tel" id="up" value="${esc(u?.phone||'')}"></div>
              </div>
              <div class="grid g2">
                <div class="field"><label class="f">역할</label><select id="ur2">${roleOpts}</select></div>
                <div class="field"><label class="f">소속 팀</label><select id="uq">
                  <option ${u?.part==='1팀'?'selected':''}>1팀</option><option ${u?.part==='2팀'?'selected':''}>2팀</option>
                  <option ${u?.part==='본사'?'selected':''}>본사</option></select></div>
              </div>
              <div class="grid g2">
                <div class="field"><label class="f">직종</label><select id="ut">
                  ${trades.map(t=>`<option value="${esc(t.name)}" data-r="${t.rate}" ${u?.trade===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
                <div class="field"><label class="f">단가 (원/공수)</label><input type="number" id="uu" value="${u?.unitRate||trades[0]?.rate||0}" step="1000"></div>
              </div>
              <div class="field"><label><input type="checkbox" id="uk" ${u?.approved!==false?'checked':''}> <span class="small">승인 상태</span></label></div>`,
        actions:[{label:'취소',value:false},{label:'저장',value:true,cls:'btn-p',before(box){
          const n = box.querySelector('#un').value.trim();
          if(!n){ toast('이름을 입력하십시오.'); return false; }
          window.__u = { name:n, phone:box.querySelector('#up').value.trim(),
            role:box.querySelector('#ur2').value, part:box.querySelector('#uq').value,
            trade:box.querySelector('#ut').value, unitRate:+box.querySelector('#uu').value,
            approved:box.querySelector('#uk').checked };
          return true; }}]
      });
      if(!ok) return;
      if(u){ await store.update('users', u.id, window.__u); await store.log('users', u.id, 'edit', '정보 수정', me); }
      else  { await store.add('users', window.__u); }
      toast('저장되었습니다.'); renderUsers();
    }
  }

              ${f('rK','근로소득세액공제율', S.taxCreditRate)}

      $('#sLat').value = p.lat.toFixed(6); $('#sLng').value = p.lng.toFixed(6);
      toast(`현재 위치로 설정했습니다. (정확도 ±${p.acc}m)`);
    };

               workStart:$('#sWs').value, workEnd:$('#sWe').value };
      await store.saveMeta('site', site); toast('저장되었습니다.');
    };

    /* 메일 */
    $('#mSave').onclick = async () => {
      mail = { to:$('#mTo').value.trim(), mode:$('#mMode').value, digest:$('#mDig').checked };
      await store.saveMeta('mail', mail); toast('저장되었습니다.');
    };

    /* 계수·요율 */
    $('#kSave').onclick = async () => {
      S = { ...S,
        hoursPerGongsu:+$('#kH').value, overtimeRate:+$('#kO').value, nightRate:+$('#kN').value,
        holidayRate:+$('#kD').value, mealAllowance:+$('#kM').value, transAllowance:+$('#kT').value,
        employmentIns:+$('#rE').value, accidentIns:+$('#rA').value, pensionRate:+$('#rP').value,
        healthRate:+$('#rH').value, ltCareRate:+$('#rL').value, pensionMinDays:+$('#rD').value,
        dayDeduction:+$('#rC').value, incomeTaxRate:+$('#rI').value, taxCreditRate:+$('#rK').value,
        localTaxRate:+$('#rG').value, minTaxLimit:+$('#rM').value
      };
      await store.saveMeta('settings', S); toast('저장되었습니다.');
    };

    /* 단가 */
    function paintTrades(){
      $('#tList').innerHTML = trades.map((t,i) => `
        <div class="rate-row">
          <input type="text" value="${esc(t.name)}" data-tn="${i}">
          <input type="number" value="${t.rate}" step="1000" data-tr="${i}">
          <button class="btn btn-sm" data-tx="${i}">✕</button>
        </div>`).join('');
      $$('[data-tx]').forEach(b => b.onclick = () => { trades.splice(+b.dataset.tx,1); paintTrades(); });
    }
    paintTrades();
    $('#tAdd').onclick = () => { trades.push({ name:'신규직종', rate:200000 }); paintTrades(); };
    $('#tSave').onclick = async () => {
      trades = $$('[data-tn]').map((inp,i) => ({
        name: inp.value.trim() || '무명',
        rate: +$$('[data-tr]')[i].value || 0
      }));
      await store.saveMeta('trades', { list: trades }); toast('저장되었습니다.');
    };

    const rs = $('#reset');
    if(rs) rs.onclick = async () => {
      if(!await confirmBox('데모 초기화','모든 데모 데이터가 삭제되고 초기 상태로 되돌아갑니다.','초기화')) return;
      store.resetDemo(); location.href = 'index.html';
    };
  }

  go('dash');
}
</script>
</body>
</html>
