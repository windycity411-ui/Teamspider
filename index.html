<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>노가다의신 · 현장 근로자 관리</title>
<meta name="description" content="건설 현장 출역·서류·공수 관리 시스템">
<meta name="theme-color" content="#C87C00">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/style.css">
<style>
  .hero{padding-block:38px 26px; border-bottom:1px solid var(--line)}
  .hero h1{font-size:clamp(28px,6vw,40px); font-weight:700; line-height:1.15; margin-bottom:10px}
  .hero p{color:var(--ink-2); max-width:48ch; margin:0}
  .hero .mk{
    display:inline-grid; place-items:center; width:44px; height:44px; margin-bottom:16px;
    background:var(--accent); color:var(--accent-ink); border-radius:3px;
    font-family:var(--mono); font-size:22px; font-weight:600;
  }
  .cols{display:grid; grid-template-columns:1.1fr 1fr; gap:22px; padding-block:26px 60px; align-items:start}
  @media (max-width:820px){ .cols{grid-template-columns:1fr} }
  .quick{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px}
  .quick button{
    text-align:left; padding:11px 13px; border:1px solid var(--line-strong); border-radius:var(--r);
    background:var(--surface); cursor:pointer; font-family:var(--sans); color:var(--ink);
  }
  .quick button:hover{border-color:var(--accent); background:var(--accent-soft)}
  .quick b{display:block; font-size:14px; font-weight:700}
  .quick span{font-size:11.5px; color:var(--ink-3); font-family:var(--mono)}
  .job{border-bottom:1px solid var(--line); padding:15px 16px}
  .job:last-child{border-bottom:0}
  .job h4{font-size:15px; font-weight:700; margin-bottom:5px}
  .job .meta{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:8px}
  .job .pay{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; color:var(--accent)}
  .switcher{display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:var(--r); margin-bottom:16px}
  .switcher button{flex:1; border:0; background:none; padding:8px; border-radius:2px; cursor:pointer; font-family:var(--sans); font-size:13.5px; font-weight:600; color:var(--ink-3)}
  .switcher button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
</style>
</head>
<body>

<main class="wrap">

  <section class="hero">
    <span class="mk">工</span>
    <h1>노가다의신</h1>
    <p>현장 출역·서류 제출·공수 정산을 하나로 묶은 근로자 관리 시스템. 설치 없이 휴대폰 브라우저에서 바로 사용합니다.</p>
  </section>

  <div class="cols">

    <!-- ── 좌: 로그인 / 가입 ─────────────────────────── -->
    <div class="stack">
      <div class="card">
        <div class="switcher" role="tablist">
          <button id="tabLogin" role="tab" aria-selected="true">로그인</button>
          <button id="tabJoin"  role="tab" aria-selected="false">근로자 가입</button>
        </div>

        <!-- 로그인 -->
        <div id="paneLogin">
          <div class="field">
            <label class="f" for="loginPhone">휴대폰 번호</label>
            <input type="tel" id="loginPhone" placeholder="010-0000-0000" autocomplete="tel">
            <div class="hint">등록된 번호로 로그인합니다. 운영 전환 시 SMS 인증이 추가됩니다.</div>
          </div>
          <button class="btn btn-p btn-block" id="btnLogin">로그인</button>

          <div id="demoQuick" hidden>
            <p class="eyebrow" style="margin:18px 0 7px">데모 계정으로 둘러보기</p>
            <div class="quick">
              <button data-role="dev"><b>개발자</b><span>전체 권한</span></button>
              <button data-role="lead"><b>직영팀장</b><span>1팀 관리</span></button>
              <button data-role="worker"><b>근로자</b><span>출퇴근·서류</span></button>
              <button data-role="seeker"><b>구직자</b><span>공고 지원</span></button>
            </div>
          </div>
        </div>

        <!-- 가입 -->
        <div id="paneJoin" hidden>
          <div class="field">
            <label class="f" for="jName">이름</label>
            <input type="text" id="jName" autocomplete="name">
          </div>
          <div class="field">
            <label class="f" for="jPhone">휴대폰 번호</label>
            <input type="tel" id="jPhone" placeholder="010-0000-0000" autocomplete="tel">
          </div>
          <div class="grid g2">
            <div class="field">
              <label class="f" for="jTrade">직종</label>
              <select id="jTrade"></select>
            </div>
            <div class="field">
              <label class="f" for="jPart">소속 팀</label>
              <select id="jPart"><option value="1팀">1팀</option><option value="2팀">2팀</option></select>
            </div>
          </div>
          <div class="field">
            <label><input type="checkbox" id="jAgree"> <span class="small">출퇴근 기록을 위한 <b>위치정보 수집</b> 및 개인정보 처리에 동의합니다.</span></label>
            <div class="hint">위치정보는 출퇴근 버튼을 누르는 순간에만 수집하며, 그 외 시간에는 수집하지 않습니다.</div>
          </div>
          <button class="btn btn-p btn-block" id="btnJoin">가입 신청</button>
          <div class="hint" style="text-align:center; margin-top:9px">관리자 승인 후 이용 가능합니다.</div>
        </div>
      </div>
    </div>

    <!-- ── 우: 채용공고 ──────────────────────────────── -->
    <div class="panel">
      <div class="panel-h">
        <h3>채용 공고</h3>
        <span class="eyebrow">로그인 없이 지원 가능</span>
      </div>
      <div id="jobList"></div>
    </div>

  </div>
</main>

<script type="module">
import { store, uid, nowISO } from './assets/store.js';
import { ROLES, TRADES_DEFAULT, DEMO, DOC_TYPES } from './assets/config.js';
import { $, $$, esc, toast, modal, topbar, sendMail, readFileAsURL } from './assets/app.js';
import { won } from './assets/gongsu.js';

await store.ready();
topbar(null);

/* 이미 로그인되어 있으면 홈으로 */
const s = store.session();
if(s){
  const u = await store.get('users', s.id);
  if(u) location.replace(ROLES[u.role].home);
}

/* ── 탭 전환 ───────────────────────────── */
const tabs = { tabLogin:'paneLogin', tabJoin:'paneJoin' };
Object.keys(tabs).forEach(t => {
  $('#'+t).onclick = () => {
    Object.entries(tabs).forEach(([k,v]) => {
      $('#'+k).setAttribute('aria-selected', k === t);
      $('#'+v).hidden = k !== t;
    });
  };
});

/* ── 직종 목록 ─────────────────────────── */
const tradesMeta = await store.meta('trades');
const trades = Array.isArray(tradesMeta) ? tradesMeta : (tradesMeta?.list || TRADES_DEFAULT);
$('#jTrade').innerHTML = trades.map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('');

/* ── 로그인 ────────────────────────────── */
const norm = p => String(p).replace(/[^0-9]/g,'');

async function doLogin(user){
  store.setSession({ id:user.id, name:user.name, role:user.role });
  location.href = ROLES[user.role].home;
}

$('#btnLogin').onclick = async () => {
  const p = norm($('#loginPhone').value);
  if(p.length < 10) return toast('휴대폰 번호를 정확히 입력하십시오.');
  const users = await store.list('users');
  const u = users.find(x => norm(x.phone) === p);
  if(!u) return toast('등록되지 않은 번호입니다. 가입 신청을 먼저 하십시오.');
  doLogin(u);
};
$('#loginPhone').addEventListener('keydown', e => { if(e.key === 'Enter') $('#btnLogin').click(); });

/* ── 데모 빠른 진입 ────────────────────── */
if(DEMO){
  $('#demoQuick').hidden = false;
  $$('#demoQuick button').forEach(b => {
    b.onclick = async () => {
      const role = b.dataset.role;
      if(role === 'seeker'){
        store.setSession({ id:'guest', name:'구직자', role:'seeker' });
        toast('구직자는 아래 채용 공고에서 바로 지원할 수 있습니다.');
        window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' });
        return;
      }
      const users = await store.list('users');
      const u = users.find(x => x.role === role && x.approved);
      if(u) doLogin(u);
    };
  });
}

/* ── 가입 ──────────────────────────────── */
$('#btnJoin').onclick = async () => {
  const name = $('#jName').value.trim();
  const phone = $('#jPhone').value.trim();
  if(!name) return toast('이름을 입력하십시오.');
  if(norm(phone).length < 10) return toast('휴대폰 번호를 정확히 입력하십시오.');
  if(!$('#jAgree').checked) return toast('위치정보 수집 동의가 필요합니다.');

  const users = await store.list('users');
  if(users.some(x => norm(x.phone) === norm(phone))) return toast('이미 등록된 번호입니다.');

  const trade = $('#jTrade').value;
  const rate = trades.find(t => t.name === trade)?.rate || 0;
  await store.add('users', {
    name, phone, role:'worker', trade, unitRate:rate,
    part: $('#jPart').value, approved:false, geoConsent:true, geoConsentAt:nowISO()
  });
  await modal({
    title:'가입 신청 완료',
    body:`<p>관리자 승인 후 이용 가능합니다.<br>승인되면 입력하신 번호로 로그인하십시오.</p>
          <p class="small muted">승인 전에는 출퇴근·서류제출 기능이 잠겨 있습니다.</p>`,
    actions:[{ label:'확인', value:true, cls:'btn-p' }]
  });
  $('#tabLogin').click();
  $('#loginPhone').value = phone;
};

/* ── 채용공고 ──────────────────────────── */
const jobs = (await store.list('jobs')).filter(j => j.open && j.public);
const wrap = $('#jobList');

if(!jobs.length){
  wrap.innerHTML = '<div class="panel-b muted small">등록된 공고가 없습니다.</div>';
}else{
  wrap.innerHTML = jobs.map(j => `
    <div class="job">
      <h4>${esc(j.title)}</h4>
      <div class="meta">
        <span class="tag t-info">${esc(j.trade)}</span>
        <span class="tag t-off">${esc(j.period)}</span>
        <span class="tag t-off">${esc(j.count)}명</span>
      </div>
      <div class="small muted" style="margin-bottom:7px">${esc(j.location)}</div>
      <div class="spread">
        <span class="pay">${won(j.rate)}원 <span class="small muted">/ 1공수</span></span>
        <button class="btn btn-sm btn-p" data-apply="${j.id}">지원하기</button>
      </div>
    </div>`).join('');
}

$$('[data-apply]').forEach(b => {
  b.onclick = async () => {
    const job = jobs.find(j => j.id === b.dataset.apply);
    const docOpts = DOC_TYPES.filter(d => d.required).map(d =>
      `<div class="field"><label class="f">${esc(d.label)}</label>
       <input type="file" data-doc="${d.key}" accept="image/*,.pdf">
       <div class="hint">${esc(d.note)}</div></div>`).join('');

    const ok = await modal({
      title:`${job.title} 지원`,
      body:`
        <p class="small muted">${esc(job.desc).replace(/\n/g,'<br>')}</p>
        <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
        <div class="grid g2">
          <div class="field"><label class="f">이름</label><input type="text" id="apName"></div>
          <div class="field"><label class="f">연락처</label><input type="tel" id="apPhone" placeholder="010-0000-0000"></div>
        </div>
        <div class="grid g2">
          <div class="field"><label class="f">직종</label><input type="text" id="apTrade" value="${esc(job.trade)}"></div>
          <div class="field"><label class="f">경력</label><input type="text" id="apCareer" placeholder="예: 5년"></div>
        </div>
        <div class="field"><label class="f">남길 말</label><textarea id="apMemo" style="min-height:64px"></textarea></div>
        <p class="eyebrow" style="margin:16px 0 8px">제출 서류</p>
        ${docOpts}
        <div class="field"><label><input type="checkbox" id="apAgree">
          <span class="small">제출 서류가 채용 담당 부서 이메일로 전달되는 것에 동의합니다.</span></label></div>`,
      actions:[
        { label:'취소', value:false },
        { label:'지원서 제출', value:true, cls:'btn-p', before(box){
            if(!box.querySelector('#apName').value.trim()){ toast('이름을 입력하십시오.'); return false; }
            if(norm(box.querySelector('#apPhone').value).length < 10){ toast('연락처를 정확히 입력하십시오.'); return false; }
            if(!box.querySelector('#apAgree').checked){ toast('서류 전달 동의가 필요합니다.'); return false; }
            window.__ap = {
              name: box.querySelector('#apName').value.trim(),
              phone: box.querySelector('#apPhone').value.trim(),
              trade: box.querySelector('#apTrade').value.trim(),
              career: box.querySelector('#apCareer').value.trim(),
              memo: box.querySelector('#apMemo').value.trim(),
              files: Array.from(box.querySelectorAll('[data-doc]')).map(i => ({
                type: i.dataset.doc, file: i.files[0] || null
              })).filter(f => f.file)
            };
            return true;
          }}
      ]
    });
    if(!ok) return;

    const a = window.__ap;
    const docs = [];
    for(const f of a.files){
      docs.push({ type:f.type, fileName:f.file.name, url: await readFileAsURL(f.file) });
    }

    const app = await store.add('applications', {
      jobId: job.id, name:a.name, phone:a.phone, trade:a.trade,
      career:a.career, memo:a.memo, docs, status:'wait', mailStatus:'queued'
    });

    const res = await sendMail({
      subject:`[지원서] ${job.title} — ${a.name}`,
      lines:[
        `공고 : ${job.title}`,
        `성명 : ${a.name}`,
        `연락처 : ${a.phone}`,
        `직종 : ${a.trade}`,
        `경력 : ${a.career || '-'}`,
        `비고 : ${a.memo || '-'}`,
        `접수일시 : ${new Date().toLocaleString('ko-KR')}`
      ],
      files: docs
    });
    await store.update('applications', app.id, {
      mailStatus: res.ok ? 'sent' : 'fail',
      mailReason: res.reason || ''
    });

    await modal({
      title:'지원서 제출 완료',
      body:`<p>지원서가 접수되었습니다. 채용 진행 시 담당자가 연락드립니다.</p>
            ${res.ok
              ? '<div class="banner b-ok">담당 부서 이메일로 전달되었습니다.</div>'
              : `<div class="banner b-warn">이메일 자동발송 대기 상태입니다. (${esc(res.reason || '수신처 미지정')})<br>관리자 화면에서 재발송할 수 있습니다.</div>`}`,
      actions:[{ label:'확인', value:true, cls:'btn-p' }]
    });
  };
});
</script>
</body>
</html>
